# dsh-chat-dots bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with:
#   pnpm --dir ~/.dsh/profiles/web install
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (a no-op stub — all behavior lives in the browser), and
# the `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/chat-dots/client.js) load in the
# web GUI.
- insert:
    - id: chat-dots
      name: 'dsh-chat-dots'
